name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Build, test, and clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The toolchain (and clippy component) is pinned by rust-toolchain.toml;
      # `rustup show` installs it if the runner does not have it yet.
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup component add clippy
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee /tmp/test.log

      # Log download is not always reachable from every reviewer environment;
      # failed test names and panic messages must remain visible inline.
      - name: Surface test failures as annotations
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            # CARGO_TERM_COLOR=always interleaves ANSI escapes; strip them
            # before pattern matching.
            sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/test.log > /tmp/test.plain
            grep -E "^test .* FAILED$" /tmp/test.plain | while IFS= read -r line; do
              printf '::error title=failed test::%s\n' "$line"
            done
            grep -E "^test result:" /tmp/test.plain | while IFS= read -r line; do
              printf '::error title=test summary::%s\n' "$line"
            done
            awk '/---- .* stdout ----/{flag=1} flag{print} /^test result:/{flag=0}' /tmp/test.plain \
              | head -n 80 | while IFS= read -r line; do
              printf '::error title=failure detail::%s\n' "$line"
            done
          fi
          exit 1

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
