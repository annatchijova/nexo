[package]
name = "nexo-api"
description = "HTTP adapter: wires nexo-app (persistence, storage), nexo-sandbox/nexo-extraction (evidence ingestion), and a policy bundle into an authenticated HTTP surface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nexo-api"
path = "src/main.rs"

[dependencies]
nexo-core = { path = "../nexo-core" }
nexo-app = { path = "../nexo-app" }
nexo-report = { path = "../nexo-report", features = ["pdf"] }
nexo-integrity = { path = "../nexo-integrity" }
nexo-sandbox = { path = "../nexo-sandbox" }
nexo-extraction = { path = "../nexo-extraction" }
nexo-policy-ar = { path = "../nexo-policy-ar" }
nexo-policy-ar-digital-violence = { path = "../nexo-policy-ar-digital-violence" }
nexo-verifier = { path = "../nexo-verifier" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "json"] }
rand = "0.10.3"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
