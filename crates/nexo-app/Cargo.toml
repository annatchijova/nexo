[package]
name = "nexo-app"
description = "Application layer: transactions, actor ownership, and durable case state for NEXO."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4.45"
nexo-core = { path = "../nexo-core" }
nexo-integrity = { path = "../nexo-integrity" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "json"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
