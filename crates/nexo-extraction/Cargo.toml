[package]
name = "nexo-extraction"
description = "Application-side typed extraction adapter: runs an extractor image through nexo-sandbox and parses its bounded result into a typed outcome."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nexo-sandbox = { path = "../nexo-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
