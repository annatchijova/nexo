[package]
name = "nexo-verifier"
description = "Standalone verifier for NEXO export manifests and artifact bytes."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nexo-integrity = { path = "../nexo-integrity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "nexo-verify"
path = "src/main.rs"
